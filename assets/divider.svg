<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 40" width="900" height="40" role="img" aria-label="Section divider">
  <defs>
    <linearGradient id="div" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="900" y2="20">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- horizontal gradient rule -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="url(#div)" stroke-width="1"/>
  <!-- center node -->
  <circle cx="450" cy="20" r="4" fill="#0a0f17" stroke="#22d3ee" stroke-width="1.5"/>
  <circle cx="450" cy="20" r="1.5" fill="#22d3ee"/>
  <!-- flanking ticks -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.7">
    <line x1="100" y1="16" x2="100" y2="24"/>
    <line x1="800" y1="16" x2="800" y2="24"/>
  </g>
  <!-- side text -->
  <text x="120" y="24" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#5b7290">▮ SYS</text>
  <text x="780" y="24" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="3" fill="#5b7290">SYS ▮</text>
</svg>